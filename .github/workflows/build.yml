# ¿Se sigue construyendo el PDF, y siguen valiendo las comprobaciones?
#
# Dos jobs, y la separación es la clave: `gates` solo necesita Python y
# responde en segundos; `build` necesita una instalación de TeX y responde
# en minutos. Un error de contenido (una frase mal contada, un campo de
# actividad que falta) debe costar el primero, nunca el segundo.
#
# El job `gates` NO lleva `continue-on-error`. Una comprobación que no
# puede tumbar el build es decoración, y enseña a la siguiente persona a
# dejar de leer la salida.

name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Nada generado está comprometido en git (content/generated-days.tex
      # es GENERADO, no se sube), así que un checkout limpio tiene que
      # generarlo antes de poder validar nada. content/letras-trazo.json
      # (el contorno de cada letra para la actividad "traza") SÍ está en
      # git -- tools/gen_days.py lo lee directamente, sin depender de
      # matplotlib/fonttools (eso solo hace falta para regenerarlo, ver
      # tools/gen_letras_puntos.py), así que este job no gana ninguna
      # dependencia pesada por esa actividad.
      - name: Genera los .tex de los cuatro cuadernos desde su JSON
        run: make generate

      - name: Valida el contenido (frases por trimestre, campos de actividad)
        run: python3 tools/gen_days.py --check

      # El cuaderno de primeras palabras (content/palabras/q*.json):
      # primero el silabeo automático contra casos conocidos -- si alguien
      # rompe una regla de tools/silabas.py, que se vea aquí y no como
      # cientos de palabras "mal silabeadas" de golpe --, después el
      # contenido (cada palabra partida a mano igual que la parte
      # tools/silabas.py, y dentro de la escalera de sílabas de su
      # semana), y un resumen de la escalera en el resumen del job.
      - name: Comprueba el silabeo automático (casos conocidos)
        run: python3 tools/silabas.py --prueba

      - name: Valida el cuaderno de primeras palabras (silabeo, escalera de sílabas)
        run: python3 tools/gen_palabras.py --check

      - name: Resume la escalera del cuaderno de primeras palabras
        run: |
          {
            echo '## Cuaderno de primeras palabras: escalera por semana'
            echo
            python3 tools/gen_palabras.py --tabla
          } >> "$GITHUB_STEP_SUMMARY"

      # Compara content/q*.json con la escalera de content/progresion.json
      # (notes/02-revision-y-plan.md, Parte C) -- palabras/página y frase
      # más larga son límites duros (fallan el job); el vocabulario nuevo
      # por día es solo un aviso, ver la cabecera de content/progresion.json.
      - name: Mide la progresión (palabras/página, frase, vocabulario nuevo)
        run: |
          {
            echo '## Cuaderno de frases: escalera por semana'
            echo
            python3 tools/metricas.py --tabla
          } >> "$GITHUB_STEP_SUMMARY"

      # "Leo con lupa", el nivel 3 (content/lupa/q*.json, ver
      # notes/04-nivel-lupa.md): las mismas puertas con su propio
      # contenido y su propia escalera, que añade un mínimo de oraciones
      # subordinadas por texto. tools/gen_days.py --libro lupa comprueba
      # además lo que se puede comprobar a máquina en sus actividades: que
      # cada tabla lógica tenga una sola solución, que cada ruta de un mapa
      # llegue a donde dice, que cada corrección de "Caza los errores" esté
      # en el texto de la semana, que el libro tenga sus 260 días... (ver
      # la cabecera de tools/lupa.py).
      - name: Valida Leo con lupa (actividades, tablas, mapas, 260 días)
        run: python3 tools/gen_days.py --libro lupa --check

      - name: Mide la progresión de Leo con lupa (palabras, frase, subordinadas)
        run: |
          {
            echo '## Leo con lupa: escalera por semana'
            echo
            python3 tools/metricas.py --libro lupa --tabla
          } >> "$GITHUB_STEP_SUMMARY"

      # "Read and Draw", el cuaderno en inglés (content/english/q*.json, ver
      # notes/05-english.md): las mismas puertas que "Leo con lupa", con
      # las comprobaciones propias de tools/english.py -- cada frase de
      # "The missing words" y de "Match the halves" está tal cual en el
      # texto de la semana, cada palabra de "Word hunt" en el del día, el
      # texto en inglés británico y sin rastros del español -- y su propia
      # escalera, que también exige oraciones subordinadas en cada texto.
      # Mientras se escribe por trimestres, tools/libros.py dice cuántos
      # días tiene ya (dias_escritos) y se valida exactamente eso.
      - name: Valida Read and Draw (inglés, actividades, frases del texto)
        run: python3 tools/gen_days.py --libro english --check

      - name: Mide la progresión de Read and Draw (palabras, frase, subordinadas)
        run: |
          {
            echo '## Read and Draw: escalera por semana'
            echo
            python3 tools/metricas.py --libro english --tabla
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: PDF (${{ matrix.variant }})
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Color y blanco-y-negro comparten body.tex y content/generated-days.tex
      # letra por letra -- lo único que cambia es \bookcolor (ver
      # preamble.tex), fijado por main.tex/main-bw.tex antes de
      # \input{preamble}. Una matriz en vez de un job duplicado: un cambio
      # que solo rompe uno de los dos formatos tiene que ser tan visible
      # como uno que rompe los dos.
      matrix:
        include:
          - variant: color
            root: main
          - variant: bw
            root: main-bw
          # El cuaderno de primeras palabras (palabras.tex), mismo motor y
          # mismas comprobaciones: un día = una página, log limpio.
          - variant: palabras-color
            root: palabras
          - variant: palabras-bw
            root: palabras-bw
          # "Leo con lupa" (lupa.tex), el nivel 3: las mismas comprobaciones.
          - variant: lupa-color
            root: lupa
          - variant: lupa-bw
            root: lupa-bw
          # "Read and Draw" (english.tex), el cuaderno en inglés: las mismas.
          - variant: english-color
            root: english
          - variant: english-bw
            root: english-bw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Otro runner, otro checkout -- este job genera para sí mismo.
      - name: Genera los .tex de los cuatro cuadernos desde su JSON
        run: make generate

      # LuaLaTeX, no pdflatex: la letra es Andika (fonts/andika/, ver
      # preamble.tex) -- fontspec exige lualatex o xelatex. args NO lleva
      # -pdf: con latexmk_use_lualatex la propia acción añade -lualatex,
      # y -pdf fuerza pdflatex, así que los dos juntos se pisan.
      - name: Compila el cuaderno
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.root }}.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      # Nunca `grep '^!'`: con -file-line-error una línea de error empieza
      # por una ruta, y -interaction=nonstopmode escribe igualmente un PDF
      # encima del error, así que el código de salida y el PDF dicen los
      # dos que todo ha ido bien. Ver tools/checklog.py.
      - name: Lee el log correctamente
        run: python3 tools/checklog.py ${{ matrix.root }}.log

      # El diseño de cada página da por hecho que un día cabe en una sola
      # cara A4. Esto lo comprueba leyendo las páginas reales del .aux.
      # El color y el blanco-y-negro tienen que dar la misma respuesta --
      # cambiar un color no mueve un solo salto de página -- pero se
      # comprueba en los dos, nunca solo en uno.
      - name: Cada día ocupa exactamente una página
        run: python3 tools/check_pages.py ${{ matrix.root }}.aux

      - name: Resumen
        if: always()
        run: |
          pages=$(grep -oE "Output written on ${{ matrix.root }}\.pdf \([0-9]+ pages?" ${{ matrix.root }}.log \
                  | grep -oE "[0-9]+" | tail -1)
          bytes=$(stat -c%s ${{ matrix.root }}.pdf 2>/dev/null || echo 0)
          {
            echo "## Build (${{ matrix.variant }})"
            echo "| | |"
            echo "|---|---|"
            echo "| Páginas | ${pages:-desconocido} |"
            echo "| Tamaño | $((bytes / 1024)) KiB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-${{ matrix.variant }}
          path: ${{ matrix.root }}.pdf
          if-no-files-found: error
          retention-days: 30

      # El log se conserva pase lo que pase -- después de un fallo que solo
      # aparece en el log, ese es precisamente el artefacto que hace falta.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.variant }}
          path: ${{ matrix.root }}.log
          if-no-files-found: warn
          retention-days: 30
