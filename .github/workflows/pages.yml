# El cuaderno necesita una dirección.
#
# Sin esto, la única forma de conseguir el PDF es clonar el repositorio e
# instalar una distribución de TeX -- un precio demasiado alto para un
# padre o una madre que solo quiere imprimir la página de hoy. Esto
# compila y publica en cada push a `main`.
#
# Duplica a propósito los pasos de compilación de build.yml, y lee su
# propio log con tools/checklog.py en vez de fiarse de otro workflow:
# Pages no debe publicar nunca un PDF que no se haya construido limpio.
#
# NOTA PARA EL PRIMER DESPLIEGUE: crear la página de Pages de un
# repositorio por primera vez es una acción administrativa, y
# `administration` no es un permiso que el token de un workflow pueda
# recibir -- ningún valor de `enablement` llega hasta ahí. Alguien con
# permisos de administrador tiene que entrar una vez en Settings -> Pages
# -> Build and deployment -> Source y elegir "GitHub Actions". Cada push
# después de eso se publica sin nada más que hacer aquí.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Los treinta y seis PDF se compilan uno detrás de otro (con treinta,
    # unos 20 minutos): 60 deja margen para un runner lento.
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Genera los .tex de los seis cuadernos desde su JSON
        run: make generate

      - name: Valida el contenido antes de publicar nada
        run: |
          python3 tools/gen_days.py --check
          python3 tools/silabas.py --prueba
          python3 tools/gen_palabras.py --check
          python3 tools/gen_days.py --libro lupa --check
          python3 tools/gen_days.py --libro english --check
          python3 tools/fonetica.py --prueba
          python3 tools/gen_palabras.py --libro firstwords --check
          python3 tools/sylaby.py --prueba
          python3 tools/gen_palabras.py --libro slowa --check

      # Color y blanco-y-negro (main-bw.tex, ver preamble.tex \bookcolor):
      # los dos se compilan y se validan aquí, y Pages nunca publica uno
      # sin haber comprobado el otro -- son la misma promesa dos veces.
      # LuaLaTeX, no pdflatex: la letra es Andika (fonts/andika/, ver
      # preamble.tex) -- fontspec exige lualatex o xelatex. args NO lleva
      # -pdf, igual que en build.yml: con latexmk_use_lualatex la propia
      # acción añade -lualatex, y -pdf fuerza pdflatex, así que los dos
      # juntos se pisan.
      - name: Compila el cuaderno (color)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (color)
        run: python3 tools/checklog.py main.log

      - name: Cada día ocupa exactamente una página (color)
        run: python3 tools/check_pages.py main.aux

      - name: Compila el cuaderno (blanco y negro)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main-bw.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (blanco y negro)
        run: python3 tools/checklog.py main-bw.log

      - name: Cada día ocupa exactamente una página (blanco y negro)
        run: python3 tools/check_pages.py main-bw.aux

      # El cuaderno de primeras palabras (palabras.tex): las mismas dos
      # versiones y las mismas comprobaciones antes de publicar.
      - name: Compila el cuaderno de primeras palabras (color)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: palabras.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (primeras palabras, color)
        run: python3 tools/checklog.py palabras.log

      - name: Cada día ocupa exactamente una página (primeras palabras, color)
        run: python3 tools/check_pages.py palabras.aux

      - name: Compila el cuaderno de primeras palabras (blanco y negro)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: palabras-bw.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (primeras palabras, blanco y negro)
        run: python3 tools/checklog.py palabras-bw.log

      - name: Cada día ocupa exactamente una página (primeras palabras, blanco y negro)
        run: python3 tools/check_pages.py palabras-bw.aux

      # "Leo con lupa" (lupa.tex), el nivel 3: la misma promesa --
      # compilado y comprobado en los dos formatos antes de publicar nada.
      - name: Compila Leo con lupa (color)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: lupa.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (Leo con lupa, color)
        run: python3 tools/checklog.py lupa.log

      - name: Cada día ocupa exactamente una página (Leo con lupa, color)
        run: python3 tools/check_pages.py lupa.aux

      - name: Compila Leo con lupa (blanco y negro)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: lupa-bw.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (Leo con lupa, blanco y negro)
        run: python3 tools/checklog.py lupa-bw.log

      - name: Cada día ocupa exactamente una página (Leo con lupa, blanco y negro)
        run: python3 tools/check_pages.py lupa-bw.aux

      # "Read and Draw" (english.tex), el cuaderno en inglés: igual que los
      # otros tres, los dos formatos compilados y comprobados antes de
      # publicar nada.
      - name: Compila Read and Draw (color)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: english.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (Read and Draw, color)
        run: python3 tools/checklog.py english.log

      - name: Cada día ocupa exactamente una página (Read and Draw, color)
        run: python3 tools/check_pages.py english.aux

      - name: Compila Read and Draw (blanco y negro)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: english-bw.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (Read and Draw, blanco y negro)
        run: python3 tools/checklog.py english-bw.log

      - name: Cada día ocupa exactamente una página (Read and Draw, blanco y negro)
        run: python3 tools/check_pages.py english-bw.aux

      # «First Words» (firstwords.tex), las primeras palabras en inglés:
      # lo mismo, los dos formatos compilados y comprobados antes de
      # publicar nada.
      - name: Compila First Words (color)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: firstwords.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (First Words, color)
        run: python3 tools/checklog.py firstwords.log

      - name: Cada día ocupa exactamente una página (First Words, color)
        run: python3 tools/check_pages.py firstwords.aux

      - name: Compila First Words (blanco y negro)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: firstwords-bw.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (First Words, blanco y negro)
        run: python3 tools/checklog.py firstwords-bw.log

      - name: Cada día ocupa exactamente una página (First Words, blanco y negro)
        run: python3 tools/check_pages.py firstwords-bw.aux

      # «Pierwsze słowa» (slowa.tex), las primeras palabras en polaco: lo
      # mismo, los dos formatos compilados y comprobados antes de publicar
      # nada.
      - name: Compila Pierwsze słowa (color)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: slowa.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (Pierwsze słowa, color)
        run: python3 tools/checklog.py slowa.log

      - name: Cada día ocupa exactamente una página (Pierwsze słowa, color)
        run: python3 tools/check_pages.py slowa.aux

      - name: Compila Pierwsze słowa (blanco y negro)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: slowa-bw.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee el log correctamente (Pierwsze słowa, blanco y negro)
        run: python3 tools/checklog.py slowa-bw.log

      - name: Cada día ocupa exactamente una página (Pierwsze słowa, blanco y negro)
        run: python3 tools/check_pages.py slowa-bw.aux

      # Los cuadernos de verano (ediciones/<raíz>-verano.tex, ver
      # notes/07-ediciones.md): el verano de cada cuaderno, en los dos
      # formatos. Se compilan desde la raíz del repositorio, así que cada
      # PDF, log y .aux sale aquí (<raíz>-verano.pdf...), y los diez se
      # comprueban igual que los libros enteros antes de publicar nada.
      - name: Compila los cuadernos de verano
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            ediciones/main-verano.tex
            ediciones/main-bw-verano.tex
            ediciones/palabras-verano.tex
            ediciones/palabras-bw-verano.tex
            ediciones/lupa-verano.tex
            ediciones/lupa-bw-verano.tex
            ediciones/english-verano.tex
            ediciones/english-bw-verano.tex
            ediciones/firstwords-verano.tex
            ediciones/firstwords-bw-verano.tex
            ediciones/slowa-verano.tex
            ediciones/slowa-bw-verano.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee los logs y comprueba las páginas (cuadernos de verano)
        run: |
          for r in main main-bw palabras palabras-bw lupa lupa-bw \
                   english english-bw firstwords firstwords-bw slowa slowa-bw; do
            python3 tools/checklog.py "$r-verano.log"
            python3 tools/check_pages.py "$r-verano.aux"
          done

      # Las muestras gratuitas (ediciones/<raíz>-muestra.tex): las cuatro
      # primeras semanas de cada cuaderno, igual que los cuadernos de
      # verano -- compiladas desde la raíz, y comprobadas antes de
      # publicar nada.
      - name: Compila las muestras gratuitas
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            ediciones/main-muestra.tex
            ediciones/main-bw-muestra.tex
            ediciones/palabras-muestra.tex
            ediciones/palabras-bw-muestra.tex
            ediciones/lupa-muestra.tex
            ediciones/lupa-bw-muestra.tex
            ediciones/english-muestra.tex
            ediciones/english-bw-muestra.tex
            ediciones/firstwords-muestra.tex
            ediciones/firstwords-bw-muestra.tex
            ediciones/slowa-muestra.tex
            ediciones/slowa-bw-muestra.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Lee los logs y comprueba las páginas (muestras gratuitas)
        run: |
          for r in main main-bw palabras palabras-bw lupa lupa-bw \
                   english english-bw firstwords firstwords-bw slowa slowa-bw; do
            python3 tools/checklog.py "$r-muestra.log"
            python3 tools/check_pages.py "$r-muestra.aux"
          done

      - name: Monta el sitio
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          cp main.pdf _site/aprendo-a-leer.pdf
          cp main-bw.pdf _site/aprendo-a-leer-bn.pdf
          cp palabras.pdf _site/aprendo-a-leer-palabras.pdf
          cp palabras-bw.pdf _site/aprendo-a-leer-palabras-bn.pdf
          cp lupa.pdf _site/leo-con-lupa.pdf
          cp lupa-bw.pdf _site/leo-con-lupa-bn.pdf
          cp english.pdf _site/read-and-draw.pdf
          cp english-bw.pdf _site/read-and-draw-bw.pdf
          cp firstwords.pdf _site/first-words.pdf
          cp firstwords-bw.pdf _site/first-words-bw.pdf
          cp slowa.pdf _site/ucze-sie-czytac-slowa.pdf
          cp slowa-bw.pdf _site/ucze-sie-czytac-slowa-cz-b.pdf
          cp main-verano.pdf _site/aprendo-a-leer-verano.pdf
          cp main-bw-verano.pdf _site/aprendo-a-leer-verano-bn.pdf
          cp palabras-verano.pdf _site/aprendo-a-leer-palabras-verano.pdf
          cp palabras-bw-verano.pdf _site/aprendo-a-leer-palabras-verano-bn.pdf
          cp lupa-verano.pdf _site/leo-con-lupa-verano.pdf
          cp lupa-bw-verano.pdf _site/leo-con-lupa-verano-bn.pdf
          cp english-verano.pdf _site/read-and-draw-summer.pdf
          cp english-bw-verano.pdf _site/read-and-draw-summer-bw.pdf
          cp firstwords-verano.pdf _site/first-words-summer.pdf
          cp firstwords-bw-verano.pdf _site/first-words-summer-bw.pdf
          cp slowa-verano.pdf _site/ucze-sie-czytac-slowa-lato.pdf
          cp slowa-bw-verano.pdf _site/ucze-sie-czytac-slowa-lato-cz-b.pdf
          cp main-muestra.pdf _site/aprendo-a-leer-muestra.pdf
          cp main-bw-muestra.pdf _site/aprendo-a-leer-muestra-bn.pdf
          cp palabras-muestra.pdf _site/aprendo-a-leer-palabras-muestra.pdf
          cp palabras-bw-muestra.pdf _site/aprendo-a-leer-palabras-muestra-bn.pdf
          cp lupa-muestra.pdf _site/leo-con-lupa-muestra.pdf
          cp lupa-bw-muestra.pdf _site/leo-con-lupa-muestra-bn.pdf
          cp english-muestra.pdf _site/read-and-draw-sample.pdf
          cp english-bw-muestra.pdf _site/read-and-draw-sample-bw.pdf
          cp firstwords-muestra.pdf _site/first-words-sample.pdf
          cp firstwords-bw-muestra.pdf _site/first-words-sample-bw.pdf
          cp slowa-muestra.pdf _site/ucze-sie-czytac-slowa-probka.pdf
          cp slowa-bw-muestra.pdf _site/ucze-sie-czytac-slowa-probka-cz-b.pdf

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Si configure-pages ha fallado
        if: failure()
        run: |
          {
            echo '## Si esto ha fallado en configure-pages'
            echo
            echo 'Crear la página de Pages de un repositorio por primera vez'
            echo 'es una acción administrativa que ningún token de workflow'
            echo 'puede hacer. Alguien con permisos de administrador debe'
            echo 'entrar una vez en Settings -> Pages -> Build and'
            echo 'deployment -> Source y elegir "GitHub Actions".'
          } >> "$GITHUB_STEP_SUMMARY"
